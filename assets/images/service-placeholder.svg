<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#c3cfe2"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" rx="10" fill="url(#gradient)"/>
  
  <!-- Abstract financial shapes -->
  <circle cx="50" cy="50" r="25" fill="#3498db" opacity="0.7"/>
  <rect x="100" y="30" width="70" height="40" rx="5" fill="#2ecc71" opacity="0.6"/>
  <polygon points="40,100 80,80 120,110" fill="#f1c40f" opacity="0.6"/>
  
  <!-- Line chart -->
  <polyline points="30,120 60,90 90,100 120,70 150,80 180,60" stroke="#2c3e50" stroke-width="2" fill="none"/>
</svg>
