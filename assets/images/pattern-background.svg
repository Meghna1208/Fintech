<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#f0f4f8" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e6eaef" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="400" height="400" fill="url(#grid)" />
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="15" fill="#3498db" opacity="0.1"/>
  <circle cx="350" cy="50" r="10" fill="#2ecc71" opacity="0.1"/>
  <circle cx="50" cy="350" r="20" fill="#f1c40f" opacity="0.1"/>
  <circle cx="350" cy="350" r="15" fill="#e74c3c" opacity="0.1"/>
  <circle cx="200" cy="200" r="30" fill="#9b59b6" opacity="0.1"/>
</svg>
